server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # CHG-117: sin esta línea rige el valor por defecto de nginx
        # —1 MiB— y cualquier fotografía mayor moría aquí con un 413,
        # que el cliente traduce a "superan el tamaño permitido:
        # máximo 10 MiB por foto". La persona que reportaba una
        # desaparición leía que su foto de 2 MiB era demasiado grande
        # y no podía publicar. El gateway admite 52 MiB de cuerpo
        # (max_report_body_bytes); aquí se deja margen para el
        # sobrecoste del multipart y se le devuelve a la aplicación la
        # última palabra, que además la explica en problem+json en vez
        # de con una página HTML de nginx.
        client_max_body_size 56m;

        # CHG-104: con `proxy_pass http://api-gateway:8000;` literal,
        # nginx resuelve el nombre una sola vez al arrancar y se queda
        # con esa IP. Desde que api-gateway se despliega por Swarm
        # (CHG-102), cada rolling update le da una IP nueva y este
        # nginx seguía hablándole a la muerta: en el incidente real
        # fueron ~4 minutos de 502/504 en el mapa y la lista de
        # personas hasta que alguien reinició el contenedor a mano.
        #
        # Con el upstream en una variable, nginx difiere la resolución
        # a cada petición y usa el DNS embebido de Docker, así que
        # sigue al contenedor nuevo sin intervención.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://api-gateway:8000;
        # El proxy_pass literal no llevaba barra final, así que pasaba
        # el URI completo; $request_uri conserva ese comportamiento.
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # CHG-137: el index.html no se cachea — cada deploy debe llegar de
    # inmediato al navegador (tras CHG-136 hubo usuarios atascados en
    # un bundle viejo que seguía reproduciendo un bug ya corregido).
    # Los assets con hash en el nombre siguen cacheándose normal. El
    # try_files de arriba redirige internamente aquí, así que cubre
    # también las rutas del SPA.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

# CHG-037 — Despliegue continuo del frontend al servidor de producción
# local (runner self-hosted `disasters-frontend` en la Raspberry Pi).
#
# El contenedor `frontend` monta la carpeta viva, así que actualizar el
# código basta para que Metro lo sirva; además se sincronizan las
# dependencias dentro del contenedor (el volumen node_modules manda) y
# se reinicia para partir de un estado limpio. Si el árbol tiene cambios
# trackeados sin commit, el despliegue ABORTA.
name: Deploy Frontend

on:
  push:
    branches: [main]

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

env:
  FRONTEND_DIR: /home/dev/DesatreNaturalColombia/CUSOL_UIS_DisastersPlatform_Frontend
  COMPOSE_DIR: /home/dev/DesatreNaturalColombia/CUSOL_UIS_DisastersPlatform_Backend

jobs:
  deploy:
    runs-on: [self-hosted, disasters-frontend]
    steps:
      - name: Actualizar código en la carpeta de despliegue
        run: |
          cd "$FRONTEND_DIR"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::El árbol de producción tiene cambios sin commit; despliegue abortado para no destruir trabajo local."
            exit 1
          fi
          git fetch origin ${{ github.sha }}
          git reset --hard ${{ github.sha }}

      - name: Reconstruir imagen y asegurar servicio arriba
        run: |
          cd "$COMPOSE_DIR"
          docker compose build frontend
          docker compose up -d --no-deps --wait frontend

      - name: Sincronizar dependencias y reiniciar
        run: |
          cd "$COMPOSE_DIR"
          docker compose exec -T frontend npm install --no-audit --no-fund
          docker compose restart frontend
          container=$(docker compose ps -q frontend)
          for _ in $(seq 1 45); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$container")
            [ "$state" = "healthy" ] && break
            sleep 2
          done
          [ "$state" = "healthy" ]

      - name: Verificación por el proxy de producción
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3100/ >/dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:3100/api/v1/disasters >/dev/null

  # Despliegue al VPS de producción real (cusoldisasterplatform.com). Job
  # independiente del de arriba (que sigue apuntando a la Raspberry Pi de
  # pruebas): corre en su propio runner self-hosted. Aquí el frontend se
  # construye en su target `runtime` (build estático servido por nginx), no
  # el target `development` con Metro/npm que usa la Pi, así que no hace
  # falta `npm install` dentro del contenedor ni montar la carpeta viva.
  deploy-vps:
    runs-on: [self-hosted, disasters-frontend-prod]
    concurrency:
      group: deploy-frontend-vps-production
      cancel-in-progress: false
    env:
      FRONTEND_DIR: /home/cusol01/CUSOL_UIS_DisastersPlatform_Frontend
      COMPOSE_DIR: /home/cusol01
    steps:
      - name: Actualizar código en la carpeta de despliegue
        run: |
          cd "$FRONTEND_DIR"
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::El árbol de producción tiene cambios sin commit; despliegue abortado para no destruir trabajo local."
            exit 1
          fi
          git fetch origin ${{ github.sha }}
          git reset --hard ${{ github.sha }}

      - name: Reconstruir imagen de producción y asegurar servicio arriba
        run: |
          cd "$COMPOSE_DIR"
          docker compose build frontend
          docker compose up -d --wait frontend

      - name: Verificación por el dominio de producción
        run: |
          curl --fail --silent --show-error https://cusoldisasterplatform.com/ >/dev/null
          curl --fail --silent --show-error \
            https://cusoldisasterplatform.com/api/v1/disasters >/dev/null

# CHG-065 — APK de Android construido en cada push a main y publicado
# en el VPS de producción para descarga directa. El APK apunta a la API
# real (cusoldisasterplatform.com), así que cada push reconstruye la
# app con los cambios nuevos de la plataforma.
#
# El build corre en un runner hospedado de GitHub (x86_64 con Android
# SDK y Java preinstalados: la Raspberry Pi arm64 no puede compilar
# Android). El job de publicación corre en el runner del VPS y deja el
# archivo en /home/cusol01/downloads para que nginx lo sirva en
# /descargas/cusol-disasters.apk.
name: Android APK

on:
  push:
    branches: [main]

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_BASE_URL: https://cusoldisasterplatform.com
  EXPO_PUBLIC_OPERATIONAL_MAP_DATA_MODE: api
  EXPO_PUBLIC_MISSING_PERSON_DATA_MODE: api
  EXPO_PUBLIC_ADMIN_DATA_MODE: demo
  EXPO_PUBLIC_MY_SPACE_DATA_MODE: api
  # CHG-125: solicitudes «Necesitamos ayuda» contra la API real.
  EXPO_PUBLIC_HELP_REQUESTS_DATA_MODE: api
  # CHG-163: ofertas «Ofrecer comida» contra la API real.
  EXPO_PUBLIC_FOOD_OFFERS_DATA_MODE: api
  # CHG-128: revisión embebida en el APK; el portón de actualización la
  # compara con el manifiesto publicado junto al APK en el VPS.
  EXPO_PUBLIC_APP_REVISION: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      # CHG-128: la revisión viaja en un archivo generado, no solo en la
      # variable de entorno — el inlining de babel no llegó al bundle en
      # el build real de CI y el APK salió sin revisión embebida.
      - name: Embeber la revisión del build
        run: |
          printf '// Generado por el workflow Android APK (CHG-128).\nexport const EMBEDDED_APP_REVISION: string | null = "%s";\n' \
            "$GITHUB_SHA" > src/features/app-update/appRevision.ts
          cat src/features/app-update/appRevision.ts

      - name: Generar proyecto nativo de Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK de release
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: cusol-disasters-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error

  publish-vps:
    needs: build
    runs-on: [self-hosted, disasters-frontend-prod]
    timeout-minutes: 10
    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: cusol-disasters-apk
          path: apk

      - name: Dejar el APK disponible para descarga
        run: |
          mkdir -p /home/cusol01/downloads
          install -m 0644 apk/app-release.apk \
            /home/cusol01/downloads/cusol-disasters.apk
          # CHG-128: manifiesto de versión junto al APK, con la misma
          # revisión que el build embebió. Se escribe DESPUÉS del APK
          # para que nunca anuncie una versión que aún no se descarga.
          printf '{"revision":"%s","publishedAt":"%s"}\n' \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > /home/cusol01/downloads/cusol-disasters.version.json.tmp
          install -m 0644 /home/cusol01/downloads/cusol-disasters.version.json.tmp \
            /home/cusol01/downloads/cusol-disasters.version.json
          rm -f /home/cusol01/downloads/cusol-disasters.version.json.tmp
          ls -la /home/cusol01/downloads/

      # El nginx de borde del VPS solo sirve exactamente el .apk; el
      # resto de /descargas/ lo atiende el nginx del contenedor
      # frontend. El manifiesto se copia dentro del contenedor para que
      # su try_files lo sirva como JSON; la copia en ~/downloads queda
      # como fuente persistente (el deploy web la re-copia tras cada
      # rebuild del contenedor).
      - name: Servir el manifiesto por el frontend
        run: |
          cd /home/cusol01
          container=$(docker compose ps -q frontend)
          test -n "$container"
          docker exec "$container" mkdir -p /usr/share/nginx/html/descargas
          docker cp /home/cusol01/downloads/cusol-disasters.version.json \
            "$container":/usr/share/nginx/html/descargas/cusol-disasters.version.json
          curl --fail --silent https://cusoldisasterplatform.com/descargas/cusol-disasters.version.json | grep -F "$GITHUB_SHA"
